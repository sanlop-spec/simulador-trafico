<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apizaco Traffic Simulator Ultimate - Urban Analytics Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #090d16; color: #c9d1d9; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 360px; background: #161b22; padding: 18px; border-right: 1px solid #30363d; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; z-index: 10; }
        #viewport { flex: 1; position: relative; background: #05070e; cursor: grab; }
        #viewport:active { cursor: grabbing; }
        canvas { width: 100%; height: 100%; display: block; }
        h2 { color: #58a6ff; font-size: 1.15rem; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
        .control-group { background: #21262d; padding: 10px 12px; border-radius: 6px; border: 1px solid #30363d; }
        label { display: block; font-size: 0.78rem; margin-bottom: 4px; color: #8b949e; }
        select, input[type="range"] { width: 100%; padding: 6px 8px; background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 4px; margin-top: 4px; font-size: 0.85rem; }
        button { background: #238636; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 4px; font-size: 0.82rem; }
        button:hover { background: #2ea043; }
        .btn-secondary { background: #30363d; }
        .btn-secondary:hover { background: #484f58; }
        .btn-special { background: #8957e5; }
        .btn-special:hover { background: #9e6aed; }
        .btn-danger { background: #da3633; }
        .btn-danger:hover { background: #f85149; }
        
        .mode-container { display: flex; gap: 6px; margin-top: 4px; }
        .mode-btn { flex: 1; padding: 6px; font-size: 0.75rem; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 4px; cursor: pointer; }
        .mode-btn.active { background: #1f6beb; border-color: #58a6ff; color: white; font-weight: bold; }

        .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
        .metric-card { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 8px; }
        .metric-title { font-size: 0.65rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
        .metric-value { font-size: 1rem; font-weight: bold; color: #58a6ff; margin-top: 2px; }
        
        .instructions { font-size: 0.72rem; color: #8b949e; line-height: 1.3; background: #161b22; padding: 8px; border-radius: 4px; border-left: 3px solid #58a6ff; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: #c9d1d9; cursor: pointer; margin-top: 4px; }
        .checkbox-label input { width: auto; margin: 0; }
        .time-display { font-family: monospace; font-size: 1rem; color: #58a6ff; font-weight: bold; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Apizaco Traffic Ultimate</h2>
        
        <div class="instructions">
            💡 Scroll (Zoom) | Clic + Arrastrar (Pan)<br>
            💡 Clic en calle (Accidente/Cierre) | Clic en nodo (Semáforo)
        </div>

        <!-- Reloj y Ciclo de Hora Pico -->
        <div class="control-group">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label style="font-weight: bold; color: #c9d1d9; margin: 0;">Reloj Urbano (Ciclo Circadiano)</label>
                <span id="time-display" class="time-display">08:00 AM</span>
            </div>
            <input type="range" id="time-slider" min="6" max="22" value="8" step="0.5">
            <span id="peak-status" style="font-size: 0.75rem; color: #f59e0b; font-weight: bold;">🔥 Hora Pico Matutina (Escuelas/Trabajo)</span>
        </div>

        <!-- Teoría de Juegos & Braess -->
        <div class="control-group">
            <label style="font-weight: bold; color: #c9d1d9;">Estrategia de Agentes (Game Theory)</label>
            <div class="mode-container">
                <button id="btn-mode-ego" class="mode-btn active">Instinto (Nash)</button>
                <button id="btn-mode-ia" class="mode-btn">IA (Social Optimal)</button>
            </div>
            <button id="btn-braess" class="btn-special">🧪 Activar Paradoja de Braess (Vía Exprés)</button>
        </div>

        <!-- Control Adaptativo de Semáforos -->
        <div class="control-group">
            <label style="font-weight: bold; color: #c9d1d9;">Control Adaptativo de Semáforos</label>
            <div class="mode-container">
                <button id="btn-sem-fixed" class="mode-btn active">Fijo (60s)</button>
                <button id="btn-sem-adaptive" class="mode-btn">Adaptativo IA</button>
            </div>
        </div>

        <!-- Renderizado & Capas Visuales -->
        <div class="control-group">
            <label style="font-weight: bold; color: #c9d1d9;">Renderizado y Faros Nocturnos</label>
            <label class="checkbox-label">
                <input type="checkbox" id="chk-night" checked> Modo Nocturno (Luces & Faros)
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="chk-heatmap"> Activar Mapa de Calor (Heatmap)
            </label>
        </div>

        <!-- Incidentes y Controles -->
        <div class="control-group">
            <label style="font-weight: bold; color: #c9d1d9;">Gestión de Incidentes</label>
            <button id="btn-clear-events" class="btn-danger">Limpiar Todos los Incidentes</button>
        </div>

        <!-- Matriz OD -->
        <div class="control-group">
            <label style="font-weight: bold; color: #c9d1d9;">Matriz Origen - Destino (OD)</label>
            <div style="margin-bottom: 6px;">
                <label>Origen</label>
                <select id="select-origin"></select>
            </div>
            <div>
                <label>Destino</label>
                <select id="select-destination"></select>
            </div>
        </div>

        <!-- Analytics e Exportación -->
        <div class="control-group">
            <label style="font-weight: bold; color: #c9d1d9;">Métricas de Desempeño Vial</label>
            <div class="metric-grid">
                <div class="metric-card">
                    <div class="metric-title">Tiempo Medio</div>
                    <div class="metric-value" id="metric-avg-time">0.0 min</div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Saturación</div>
                    <div class="metric-value" id="metric-saturation">0%</div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Retardo Semáforos</div>
                    <div class="metric-value" id="metric-delay">0.0 s</div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Nivel Servicio</div>
                    <div class="metric-value" id="metric-los" style="color: #2ea043;">LOS A</div>
                </div>
            </div>
            <button id="btn-export-csv" class="btn-secondary" style="margin-top: 8px;">📊 Exportar Reporte CSV</button>
        </div>

        <button id="btn-step">Pausar Simulación</button>
    </div>

    <div id="viewport">
        <canvas id="traffic-canvas"></canvas>
    </div>

    <script type="module" src="./src/main.ts"></script>
</body>
</html>
